<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeCity Alert Platform - Cartagena</title>

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <h1>🛡️ SafeCity</h1>
        <span>Cartagena Alert Platform</span>
      </div>
      <nav class="nav">
        <span id="userInfo" class="user-info" style="display: none">
          Welcome, <strong id="userName"></strong>
        </span>
        <button id="loginBtn" class="btn btn-primary">Login</button>
        <button id="registerBtn" class="btn btn-secondary">Register</button>
        <button id="logoutBtn" class="btn btn-danger" style="display: none">
          Logout
        </button>
      </nav>
    </header>

    <!-- Main content -->
    <main class="main">
      <!-- Sidebar -->
      <aside class="sidebar">
        <h2>Report Alert</h2>
        <p class="info-text">Click on the map to set location</p>

        <form id="alertForm" class="alert-form">
          <input type="text" id="title" placeholder="Alert title" required />
          <textarea
            id="description"
            placeholder="Describe the issue..."
            rows="3"
            required
          ></textarea>

          <select id="categoryId" required>
            <option value="">Select risk type</option>
            <option value="1">🕳️ Pothole</option>
            <option value="2">🌊 Flooding</option>
            <option value="3">⚡ Electric Risk</option>
            <option value="4">🚨 Insecurity</option>
            <option value="5">🚗 Accident</option>
          </select>

          <input
            type="text"
            id="coords"
            placeholder="Coordinates (click on map)"
            readonly
          />
          <!-- ===== FILTER ALERTS SECTION ===== -->
          <h3>🔍 Filter Alerts</h3>

          <!-- Filter by Type -->
          <label for="filterType">Alert Type:</label>
          <select id="filterType">
            <option value="">All Types</option>
            <option value="hueco">Pothole</option>
            <option value="inundacion">Flooding</option>
            <option value="accidente">Accident</option>
            <option value="riesgo_electrico">Electrical Risk</option>
            <option value="inseguridad">Insecurity</option>
          </select>

          <!-- Filter by Radius -->
          <label for="filterRadius">Radius (km):</label>
          <input
            type="number"
            id="filterRadius"
            placeholder="e.g., 5"
            min="1"
            max="50"
            value="5"
          />

          <!-- Apply Filters Button -->
          <button
            id="applyFiltersBtn"
            style="
              background: #3498db;
              color: white;
              padding: 8px 16px;
              border: none;
              border-radius: 4px;
              cursor: pointer;
              margin-top: 8px;
              width: 100%;
            "
          >
            Apply Filters
          </button>

          <!-- Clear Filters Button -->
          <button
            id="clearFiltersBtn"
            style="
              background: #95a5a6;
              color: white;
              padding: 8px 16px;
              border: none;
              border-radius: 4px;
              cursor: pointer;
              margin-top: 6px;
              width: 100%;
            "
          >
            Clear Filters
          </button>

          <hr style="margin: 16px 0" />

          <button type="submit" class="btn btn-success">Submit Alert</button>
        </form>

        <div class="stats">
          <h3>Statistics</h3>
          <p>Total alerts: <strong id="totalAlerts">0</strong></p>
        </div>
      </aside>

      <!-- Map -->
      <div id="map" class="map"></div>
    </main>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
      <div class="modal-content">
        <span class="close" data-modal="loginModal">&times;</span>
        <h2>Login</h2>
        <form id="loginForm">
          <input type="email" id="loginEmail" placeholder="Email" required />
          <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            required
          />
          <button type="submit" class="btn btn-primary">Login</button>
        </form>
      </div>
    </div>

    <!-- Register Modal -->
    <div id="registerModal" class="modal">
      <div class="modal-content">
        <span class="close" data-modal="registerModal">&times;</span>
        <h2>Register</h2>
        <form id="registerForm">
          <input
            type="text"
            id="registerName"
            placeholder="Full name"
            required
          />
          <input type="email" id="registerEmail" placeholder="Email" required />
          <input
            type="password"
            id="registerPassword"
            placeholder="Password (min 6)"
            required
            minlength="6"
          />
          <button type="submit" class="btn btn-primary">Register</button>
        </form>
      </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <!-- Custom JS -->
    <script src="app.js"></script>
  </body>
</html>
