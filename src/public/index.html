<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeCity Alert Platform - Cartagena</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <h1>🛡️ SafeCity</h1>
        <span>Cartagena Alert Platform</span>
      </div>
      <nav class="nav">
        <span id="userInfo" class="user-info" style="display: none">
          Welcome, <strong id="userName"></strong>
        </span>
        <button id="loginBtn" class="btn btn-primary">Login</button>
        <button id="registerBtn" class="btn btn-secondary">Register</button>
        <button
          id="logoutBtnHeader"
          class="btn btn-danger"
          style="display: none"
        >
          Logout
        </button>
      </nav>
    </header>

    <main class="main">
      <button id="toggleSidebar" class="toggle-btn" title="Open/Close Menu">
        ☰
      </button>
      <aside id="sidebar" class="sidebar closed">
        <div class="sidebar-nav">
          <button class="nav-btn active" data-section="new-alert">
            ➕ New Alert
          </button>
          <button class="nav-btn" data-section="view-alerts">
            📋 My Alerts
          </button>

          <button class="nav-btn" data-section="account">👤 Account</button>
          <button
            class="nav-btn"
            data-section="review-queue"
            id="reviewQueueNavBtn"
            style="display: none"
          >
            📋 Review Queue
          </button>
          <button class="nav-btn" data-section="statistics">
            📊 Statistics
          </button>
        </div>

        <div style="padding: 0 12px 12px">
          <button
            id="undoDeleteBtn"
            type="button"
            style="
              display: none;
              background: #e67e22;
              color: white;
              width: 100%;
              padding: 10px;
              border: none;
              border-radius: 4px;
              cursor: pointer;
              font-weight: 600;
            "
          >
            ↩ Undo delete
          </button>
        </div>

        <section id="new-alert" class="sidebar-section active">
          <h2>Report Alert</h2>
          <p class="info-text">Click on the map to set location</p>

          <form id="alertForm" class="alert-form">
            <input type="text" id="title" placeholder="Alert title" required />
            <textarea
              id="description"
              placeholder="Describe the issue..."
              rows="3"
              required
            ></textarea>

            <select id="categoryId" required>
              <option value="">Select risk type</option>
              <option value="1">🕳️ Pothole</option>
              <option value="2">🌊 Flooding</option>
              <option value="3">⚡ Electric Risk</option>
              <option value="4">🚨 Insecurity</option>
              <option value="5">🚗 Accident</option>
            </select>

            <input
              type="text"
              id="coords"
              placeholder="Coordinates (click on map)"
              readonly
            />
            <button
              type="button"
              id="clearLocationBtn"
              style="
                background: #95a5a6;
                color: white;
                width: 100%;
                padding: 8px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                margin-top: 8px;
                font-weight: 600;
              "
            >
              Clear location
            </button>

            <button
              type="button"
              id="myLocationBtn"
              style="
                background: #27ae60;
                color: white;
                width: 100%;
                padding: 10px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                margin-top: 8px;
                font-weight: 600;
              "
            >
              📍 My Location
            </button>

            <button type="submit" class="btn btn-success">Submit Alert</button>
          </form>
        </section>

        <section id="view-alerts" class="sidebar-section">
          <h2>My Alerts</h2>
          <div id="userAlertsList" class="alerts-list">
            <p style="text-align: center; color: #7f8c8d">No alerts yet</p>
          </div>
        </section>

        <section id="statistics" class="sidebar-section">
          <h2>📊 Statistics</h2>
          <div class="stats">
            <p>Total Alerts: <strong id="totalAlerts">0</strong></p>
            <p>Active: <strong id="activeAlerts">0</strong></p>
            <p>Resolved: <strong id="resolvedAlerts">0</strong></p>
          </div>
        </section>

        <section
          id="review-queue"
          class="sidebar-section"
          style="display: none"
        >
          <h2>📋 Review Queue</h2>
          <p>Pending: <strong id="pendingCount">0</strong></p>
          <button
            id="reviewNextBtn"
            type="button"
            style="
              background: #2980b9;
              color: white;
              width: 100%;
              padding: 10px;
              border: none;
              border-radius: 4px;
              cursor: pointer;
              margin-top: 8px;
              font-weight: 600;
            "
          >
            Review next
          </button>
          <div id="reviewedAlert" style="margin-top: 10px"></div>
        </section>

        <section id="account" class="sidebar-section">
          <h2>👤 Account</h2>
          <div
            id="accountInfo"
            style="padding: 16px; background: #f8f9fa; border-radius: 6px"
          >
            <p><strong>Email:</strong> <span id="userEmail">-</span></p>
            <p><strong>Name:</strong> <span id="userName">-</span></p>
            <p><strong>Role:</strong> <span id="userRole">-</span></p>
            <button
              id="logoutBtn"
              style="
                background: #e74c3c;
                color: white;
                padding: 10px 16px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                margin-top: 16px;
                width: 100%;
                font-weight: 600;
              "
            >
              🚪 Logout
            </button>
          </div>
        </section>
      </aside>

      <div id="map" class="map">
        <div id="pagination">
          <button id="prevBtn">Previous</button>
          <span id="pageInfo">Page 1 of 1</span>
          <button id="nextBtn">Next</button>
        </div>
      </div>
    </main>

    
    <div id="loginModal" class="modal">
      <div class="modal-content">
        <span class="close" data-modal="loginModal">&times;</span>
        <h2>Login</h2>
        <form id="loginForm">
          <input type="email" id="loginEmail" placeholder="Email" required />
          <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            required
          />
          <button type="submit" class="btn btn-primary">Login</button>
        </form>
      </div>
    </div>

    <div id="registerModal" class="modal">
      <div class="modal-content">
        <span class="close" data-modal="registerModal">&times;</span>
        <h2>Register</h2>
        <form id="registerForm">
          <input
            type="text"
            id="registerName"
            placeholder="Full name"
            required
          />
          <input type="email" id="registerEmail" placeholder="Email" required />
          <input
            type="password"
            id="registerPassword"
            placeholder="Password (min 6)"
            required
            minlength="6"
          />
          <button type="submit" class="btn btn-primary">Register</button>
        </form>
      </div>
    </div>

    <div id="notification" class="notification"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    
    <script src="app.js"></script>
  </body>
</html>
