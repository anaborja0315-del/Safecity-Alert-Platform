<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeCity Alert Platform - Cartagena</title>

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <h1>🛡️ SafeCity</h1>
        <span>Cartagena Alert Platform</span>
      </div>
      <nav class="nav">
        <span id="userInfo" class="user-info" style="display: none">
          Welcome, <strong id="userName"></strong>
        </span>
        <button id="loginBtn" class="btn btn-primary">Login</button>
        <button id="registerBtn" class="btn btn-secondary">Register</button>
        <button id="logoutBtnHeader" class="btn btn-danger" style="display: none;">Logout</button>
        </button>
      </nav>
    </header>

    <!-- Main content -->
    <main class="main">

      <!-- Toggle Button for Sidebar -->
<button id="toggleSidebar" class="toggle-btn" title="Open/Close Menu">
  ☰
</button>
      <!-- SIDEBAR COLAPSABLE -->
<aside id="sidebar" class="sidebar closed">
  
  <!-- BOTONES DE NAVEGACIÓN -->
  <div class="sidebar-nav">
    <button class="nav-btn active" data-section="new-alert">
      ➕ New Alert
    </button>
    <button class="nav-btn" data-section="view-alerts">
      📋 My Alerts
    
    <button class="nav-btn" data-section="account">
      👤 Account
    </button>
    <button class="nav-btn" data-section="statistics">
  📊 Statistics
</button>
  </div>

  <!-- SECCIÓN 1: NEW ALERT -->
  <section id="new-alert" class="sidebar-section active">
    <h2>Report Alert</h2>
    <p class="info-text">Click on the map to set location</p>

    <form id="alertForm" class="alert-form">
      <input type="text" id="title" placeholder="Alert title" required />
      <textarea
        id="description"
        placeholder="Describe the issue..."
        rows="3"
        required
      ></textarea>

      <select id="categoryId" required>
        <option value="">Select risk type</option>
        <option value="1">🕳️ Pothole</option>
        <option value="2">🌊 Flooding</option>
        <option value="3">⚡ Electric Risk</option>
        <option value="4">🚨 Insecurity</option>
        <option value="5">🚗 Accident</option>
      </select>

      <input
        type="text"
        id="coords"
        placeholder="Coordinates (click on map)"
        readonly
      />

      <button type="submit" class="btn btn-success">Submit Alert</button>
    </form>
  </section>

  <!-- SECCIÓN 2: VIEW ALERTS -->
  <section id="view-alerts" class="sidebar-section">
    <h2>My Alerts</h2>
    <div id="userAlertsList" class="alerts-list">
      <p style="text-align: center; color: #7F8C8D;">No alerts yet</p>
    </div>
  </section>

  <!-- SECCIÓN 3: STATISTICS -->
  <section id="statistics" class="sidebar-section">
    <h2>📊 Statistics</h2>
    <div class="stats">
      <p>Total Alerts: <strong id="totalAlerts">0</strong></p>
      <p>Active: <strong id="activeAlerts">0</strong></p>
      <p>Resolved: <strong id="resolvedAlerts">0</strong></p>
    </div>
  </section>

 

  <!-- SECCIÓN 4: ACCOUNT -->
<section id="account" class="sidebar-section">
  <h2>👤 Account</h2>
  <div id="accountInfo" style="padding: 16px; background: #f8f9fa; border-radius: 6px;">
    <p><strong>Email:</strong> <span id="userEmail">-</span></p>
    <p><strong>Name:</strong> <span id="userName">-</span></p>
    <p><strong>Role:</strong> <span id="userRole">-</span></p>
    <button id="logoutBtn" style="background: #E74C3C; color: white; padding: 10px 16px; border: none; border-radius: 4px; cursor: pointer; margin-top: 16px; width: 100%; font-weight: 600;">
      🚪 Logout
    </button>
  </div>
</section>

</aside>

      <!-- Map -->
      <div id="map" class="map"></div>
    </main>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
      <div class="modal-content">
        <span class="close" data-modal="loginModal">&times;</span>
        <h2>Login</h2>
        <form id="loginForm">
          <input type="email" id="loginEmail" placeholder="Email" required />
          <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            required
          />
          <button type="submit" class="btn btn-primary">Login</button>
        </form>
      </div>
    </div>

    <!-- Register Modal -->
    <div id="registerModal" class="modal">
      <div class="modal-content">
        <span class="close" data-modal="registerModal">&times;</span>
        <h2>Register</h2>
        <form id="registerForm">
          <input
            type="text"
            id="registerName"
            placeholder="Full name"
            required
          />
          <input type="email" id="registerEmail" placeholder="Email" required />
          <input
            type="password"
            id="registerPassword"
            placeholder="Password (min 6)"
            required
            minlength="6"
          />
          <button type="submit" class="btn btn-primary">Register</button>
        </form>
      </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <!-- Custom JS -->
    <script src="app.js"></script>
  </body>
</html>
